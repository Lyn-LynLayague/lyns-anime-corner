<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Lyn's Anime Corner</title>

    <style>
    body {
        font-family: Arial, sans-serif;
        max-width: 1000px;
        margin: 0 auto;
        padding: 30px 20px;
        background-color: #fff8f3;
        color: #333;
    }

    h1 {
        text-align: center;
        font-size: 42px;
        color: #7b3f61;
        margin-bottom: 5px;
    }

    nav {
        text-align: center;
        margin: 20px 0 40px;
    }

    nav ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    nav li {
        display: inline-block;
        margin: 0 10px;
    }

    nav a {
        text-decoration: none;
        color: #7b3f61;
        font-weight: bold;
    }

    nav a:hover {
        color: #c44f87;
    }

    main {
        background-color: #ffffff;
        padding: 30px;
        border-radius: 18px;
        text-align: center;
    }

    main h2 {
        color: #7b3f61;
        font-size: 30px;
    }

    main ul {
        list-style: none;
        padding: 0;
    }

    main li {
        margin: 15px 0;
        font-size: 17px;
    }

    footer {
        text-align: center;
        margin-top: 40px;
        color: #777;
        font-size: 14px;
    }

    form {
      max-width: 450px;
      margin: 30px auto;
    }

    fieldset {
      padding: 18px;
      border: 2px solid #ddd;
      border-radius: 10px;
      background-color: #fff;
    }

    legend {
      font-size: 1.1rem;
      font-weight: bold;
      padding: 0 8px;
    }

    form p {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      border: 1px solid #bbb;
      border-radius: 5px;
      font-size: 0.9rem;
    }

    textarea {
      resize: vertical;
    }

    button {
      padding: 8px 16px;
      border: none;
      border-radius: 5px;
      font-size: 0.9rem;
      cursor: pointer;
    }

</style>

</head>

<body>

    <header>

        <h1>Lyn's Anime Corner</h1>

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>

    </header>

<main>

    <h2>Contact Us</h2>

    <p>Want to ask about our products? You can reach us through these methods:</p>

    <ul>
        <li>Email: lynsanimecorner@gmail.com</li>
        <li>Facebook: Lyn's Anime Corner</li>
    </ul>

            <form id="demo">
          <fieldset>
            <legend>Your details</legend>
            <p>
              <label for="nm">Name</label><br>
              <input type="text" id="nm" name="nm" required>
            </p>
            <p>
              <label for="em">Email</label><br>
              <input type="email" id="em" name="em" required>
            </p>

            <p>
              <label for="subject">Subject</label>
              <select id="subject" name="subject">
                <option value="order-status">Select an option</option>
                <option value="product-question">Product question</option>
                <option value="order-status">Order status</option>
                <option value="product-availability">Product availability</option>
                <option value="wholesale-enquiry">Wholesale enquiry</option>
                <option value="something-else">Something else</option>
              </select>
           </p>

            <p>
              <label for="message">Message</label>
              <textarea id="message" name="message" rows="6" required></textarea>
            </p>

            <button type="submit">Send message</button>
         </fieldset>
        </form>

</main>

    <footer>
        <p>© 2026 Lyn's Anime Corner</p>
    </footer>

</body>
</html>
