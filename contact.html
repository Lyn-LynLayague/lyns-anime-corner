            <form id="demo">
          <fieldset>
            <legend>Your details</legend>
            <p>
              <label for="nm">Name</label><br>
              <input type="text" id="nm" name="nm" required>
            </p>
            <p>
              <label for="em">Email</label><br>
              <input type="email" id="em" name="em" required>
            </p>

            <p>
              <label for="subject">Subject</label>
              <select id="subject" name="subject">
                <option value="order-status">Select an option</option>

                <option value="product-availability">Product availability</option>
                <option value="wholesale-enquiry">Wholesale enquiry</option>
                <option value="something-else">Something else</option>
              </select>
           </p>

            <p>
              <label for="message">Message</label>
              <textarea id="message" name="message" rows="6" required></textarea>
            </p>

            <button type="submit">Send message</button>
         </fieldset>
